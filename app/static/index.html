<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>team3 スナップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上のバー：アプリの名前と説明 -->
  <header class="toolbar">
    <h1>team3 スナップ</h1>
    <!-- 図形を追加するボタン。中身は app.js が作る -->
    <div id="shape-buttons" class="shape-buttons"></div>
    <!-- テキストを追加するボタン -->
    <div class="shape-buttons">
      <button id="add-text" class="text-button" title="テキストを追加">T</button>
    </div>
    <!-- 文字の設定。テキストを選んでいるときだけ使える（それ以外は灰色になる） -->
    <fieldset id="text-tools" class="text-tools" disabled>
      <select id="font-family" title="フォント">
        <option value="'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif">ゴシック体</option>
        <option value="'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif">明朝体</option>
        <option value="'BIZ UDGothic', 'Osaka-Mono', monospace">等幅</option>
      </select>
      <input id="font-size" type="number" min="8" max="200" step="2" title="文字の大きさ">
      <input id="font-color" type="color" title="文字の色">
      <label class="toggle" title="太字">
        <input id="font-bold" type="checkbox">
        <b>B</b>
      </label>
    </fieldset>
    <!-- 特徴点の印を表示するかどうか -->
    <label class="toggle">
      <input type="checkbox" id="show-markers" checked>
      特徴点を表示
    </label>
    <span class="hint">ドラッグで移動・四隅で拡大縮小・ダブルクリックで文字を編集・Delete キーで削除</span>
  </header>

  <!-- キャンバス（図形を置く作業スペース）。Konva がこの中に描画する -->
  <div id="stage"></div>

  <!-- Konva.js：キャンバス上で図形を置いたりドラッグしたりするための道具 -->
  <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
  <!-- このアプリの処理 -->
  <script src="app.js"></script>
</body>
</html>
